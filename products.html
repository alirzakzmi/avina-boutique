<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محصولات | بوتیک آوینا</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="products">

<div id="app-header"></div>

<main class="container">
    <div class="page-header">
        <h1 class="page-title">تمام محصولات</h1>
        <p class="page-subtitle">مجموعه‌ای از جدیدترین لباس‌ها و اکسسوری‌های بوتیک آوینا</p>
    </div>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterProducts('all', this)">همه</button>
        <button class="filter-btn" onclick="filterProducts('sale', this)">تخفیف‌دار</button>
        <button class="filter-btn" onclick="filterProducts('cheap', this)">ارزان‌ترین</button>
        <button class="filter-btn" onclick="filterProducts('expensive', this)">گران‌ترین</button>
    </div>

    <div class="product-grid" id="productsGrid" style="padding-bottom:48px"></div>
</main>

<div id="app-footer"></div>

<div class="toast" id="toast"></div>

<script src="components/header.js"></script>
<script src="components/footer.js"></script>
<script src="assets/script.js"></script>
<script>
let currentFilter = 'all';

function renderProductsPage() {
    let list = [...PRODUCTS];
    if (currentFilter === 'sale') list = list.filter(p => p.discount);
    else if (currentFilter === 'cheap') list.sort((a,b) => a.price - b.price);
    else if (currentFilter === 'expensive') list.sort((a,b) => b.price - a.price);

    document.getElementById('productsGrid').innerHTML = list.map(p => `
        <article class="product-card">
            <a href="product.html?id=${p.id}" class="product-img-wrap">
                ${p.discount ? `<span class="product-badge">${p.discount}٪</span>` : ''}
                <img src="${p.image}" alt="${p.name}" loading="lazy">
            </a>
            <div class="product-info">
                <h3 class="product-name"><a href="product.html?id=${p.id}">${p.name}</a></h3>
                ${p.oldPrice ? `<div class="product-old-price">${formatPrice(p.oldPrice)}</div>` : ''}
                <div class="product-price">${formatPrice(p.price)}</div>
                <button class="product-btn product-btn-primary" onclick="addToCart(${p.id})">افزودن به سبد خرید</button>
                <a href="product.html?id=${p.id}" class="product-btn product-btn-outline">مشاهده محصول</a>
            </div>
        </article>
    `).join('');
}

function filterProducts(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProductsPage();
}

document.addEventListener('DOMContentLoaded', renderProductsPage);
</script>
</body>
</html>
